/** Host-side clock helper: no background simulation and no resume-time dt jump.
 * Pass document visibility events to pause/resume from the host.
 */
class ArtClock {
  constructor() { this.simSeconds=0;this.wakeSeconds=0;this.running=false;this.last=null; }
  pause() { this.running=false;this.last=null;this.wakeSeconds=0; }
  resume(now=performance.now()) { this.running=true;this.last=now;this.wakeSeconds=0; }
  tick(now=performance.now(),date=new Date()) {
    if(this.running &amp;&amp; this.last!==null) {
      const dt=Math.max(0,Math.min(.10,(now-this.last)/1000));this.simSeconds+=dt;this.wakeSeconds+=dt;

    this.last=this.running?now:null;
    return {t:this.simSeconds,wake:this.running?Math.min(1,this.wakeSeconds/1.4):0,

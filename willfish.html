      if (Math.hypot(feet[0] - doors[i][0], feet[1] - doors[i][1]) &lt;= DOOR_R + 6) { ds = doors[i]; break; }
    }
    if (!ds) return nearestWalkable(sceneName, feet[0], feet[1]);

    var sp = sc.spawn || feet;
    var dx = sp[0] - ds[0], dy = sp[1] - ds[1];
    var d = Math.hypot(dx, dy);
    if (d &lt; 1) { dx = 0; dy = -1; d = 1; }

    // 从门口开始一小步一小步往里挪，落在第一个站得住的位置
    for (var step = DOOR_STEP_IN; step &lt;= DOOR_STEP_IN + 26; step += 4) {
      var nx = ds[0] + dx / d * step, ny = ds[1] + dy / d * step;
      if (walkableIn(sceneName, nx, ny)) return [nx, ny];
    }
    return nearestWalkable(sceneName, ds[0] + dx / d * DOOR_STEP_IN, ds[1] + dy / d * DOOR_STEP_IN);
  }

  function goScene(name, feet) {
    state.scene = name;
    state.feet = pushOffDoor((feet || M.scenes[name].spawn).slice(), name);
    state.walking = false;
    path = null;
    vec = [0, 0];
    doorArmed = false;              // 进来先解除武装
    updateCamera(true);
    lastAction = &#x27;__none__&#x27;;
    checkAction(true);              // 切场景立刻重算，别留着旧状态
    post(&#x27;scene&#x27;, name);
  }

  /**
   * 只有「从门外朝门走进去」才传送。
   * 站在门上乱动不会触发，必须先离开门区、再走回来。
   */


  /**
   * 当前站的位置能做什么。
   * 只报状态给宿主，由宿主决定在底部显示哪个按钮 —— 不自动弹窗。
   */
  function currentAction() {
    if (fishing.phase !== &#x27;idle&#x27;) return null;

    if (state.scene === &#x27;shop&#x27;) {
      var m = M.scenes.shop.merchant;
      // 机器人在柜台后面，人走不到它脚下。判定范围放到整个柜台前区
      var dx = Math.abs(state.feet[0] - m[0]);
      var dy = state.feet[1] - m[1];
      if (dx &lt;= 60 &amp;&amp; dy &gt;= -10 &amp;&amp; dy &lt;= 90) return &#x27;shop&#x27;;
      return null;
    }

    if (state.scene === &#x27;home&#x27;) {
      // 灯塔里四个交互点，谁近听谁的
      var pts = [
        { kind: &#x27;rack&#x27;, p: RACK_POS },
        { kind: &#x27;chest&#x27;, p: M.scenes.home.chest },
        { kind: &#x27;tank&#x27;, p: TANK_POS },
        { kind: &#x27;mount&#x27;, p: MOUNT_POS_L },
        { kind: &#x27;mount&#x27;, p: MOUNT_POS_R },
        { kind: &#x27;dex&#x27;, p: BOOK_POS },
      ];
      var best = null, bestD = 27;
      for (var i = 0; i &lt; pts.length; i++) {
        var d = Math.hypot(state.feet[0] - pts[i].p[0], state.feet[1] - pts[i].p[1]);
        if (d &lt; bestD) { bestD = d; best = pts[i].kind; }
      }
      return best;
    }

    if (state.scene === &#x27;coast&#x27;) {
      // 必须站在桥的边缘，不是整块桥面都行。
      // 判断办法：往外 10 像素就是海，说明脚下就是边。
      return atDockEdge(state.feet[0], state.feet[1]) ? &#x27;fish&#x27; : null;
    }
    return null;
  }

  var lastAction = &#x27;__none__&#x27;;
  function checkAction(force) {
    var a = currentAction();
    if (force || a !== lastAction) {
      lastAction = a;
      post(&#x27;action&#x27;, { kind: a, hasRod: state.hasRod, scene: state.scene });
    }
  }

  /** 海岸的钓点：进入范围就通知宿主弹出钓鱼窗口 */
  /** 桥面：海岸导航里的第二块可走区域 */
  function onDock(x, y) {
    var polys = (M.navigation.coast &amp;&amp; M.navigation.coast.walkablePolygons) || [];
    return polys.length &gt; 1 &amp;&amp; pointInPoly(x, y, polys[1]);
  }

  /**
   * 站在桥边缘没有。
   * 人要在桥上，而且往外一小步就是海 —— 桥中间不算。
   */
  var EDGE_R = 6;
  function atDockEdge(x, y) {
    if (!onDock(x, y)) return false;
    for (var a = 0; a &lt; 12; a++) {
      var t = a / 12 * Math.PI * 2;
      if (isSea(x + Math.cos(t) * EDGE_R, y + Math.sin(t) * EDGE_R)) return true;
    }
    return false;
  }

  /** 海：可走区域之外、且在水面高度带里。屋子内部不算 */
  function isSea(x, y) {
    var polys = (M.navigation.coast &amp;&amp; M.navigation.coast.walkablePolygons) || [];
    for (var i = 0; i &lt; polys.length; i++) if (pointInPoly(x, y, polys[i])) return false;
    return y &gt;= 165 &amp;&amp; y &lt;= 600;
  }

  /** 脚下 26 像素内有海水就能下竿，不必走到码头那一点 */
  var SHORE_R = 26;
  function nearShore(x, y) {
    for (var a = 0; a &lt; 16; a++) {
      var t = a / 16 * Math.PI * 2;
      if (isSea(x + Math.cos(t) * SHORE_R, y + Math.sin(t) * SHORE_R)) return true;
    }
    return false;
  }

  /** 最近的一小片海，用来决定鱼钩落点 */
  function nearestSea(x, y) {
    for (var r = 10; r &lt;= 60; r += 6) {
      for (var a = 0; a &lt; 24; a++) {
        var t = a / 24 * Math.PI * 2;
        var sx = x + Math.cos(t) * r, sy = y + Math.sin(t) * r;
        if (isSea(sx, sy)) return [sx, sy];
      }
    }
    return [x + 30, y];
  }


  function checkDoors(mx, my) {
    var f = state.feet;
    var list = doorsHere();
    var nearAny = false;

    for (var i = 0; i &lt; list.length; i++) {
      var d = list[i];
      var dx = d.pos[0] - f[0], dy = d.pos[1] - f[1];
      var dist = Math.hypot(dx, dy);
      if (dist &gt; DOOR_R) continue;
      nearAny = true;
      if (!doorArmed) continue;
      // 朝门的方向走才算，背对着门动不触发
      var toward = dist &lt; 1 ? 1 : (mx * dx + my * dy) / dist;
      if (toward &gt; 0.25) { goScene(d.to, d.at); return; }
    }

    if (!nearAny) doorArmed = true;
  }

  // ---------- 摄像机：室外跟随，缓慢移动，不缩放角色 ----------
  function updateCamera(snap) {
    var sc = M.scenes[state.scene];
    var size = sc.size || [VW, VH];
    if (size[0] &lt;= VW &amp;&amp; size[1] &lt;= VH) { state.camera = [0, 0]; return; }
    // 横向固定用素材包给的机位，跟着角色横移会把右边拉出没画的区域
    var fixedX = (sc.defaultCamera &amp;&amp; sc.defaultCamera[0]) || 0;
    var tx = fixedX;
    var ty = state.feet[1] - VH * 0.65;
    tx = Math.max(0, Math.min(size[0] - VW, tx));
    ty = Math.max(0, Math.min(size[1] - VH, ty));
    if (snap) { state.camera = [tx, ty]; return; }
    state.camera[0] = tx;                                  // 横向不插值，直接固定
    state.camera[1] += (ty - state.camera[1]) * 0.08;
  }

  // ---------- 主循环 ----------
  var lastFrame = null, raf = null;

  function step(now) {
    if (!clock || !clock.running) { raf = null; return; }
    var o = clock.tick(now);

    var dt = lastFrame === null ? 0 : Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    // 钓鱼时人不动，手势交给控鱼
    var frozen = fishing.phase !== &#x27;idle&#x27;;
    var mx = 0, my = 0;
    if (frozen) { vec = [0, 0]; path = null; }
    if (vec[0] || vec[1]) { mx = vec[0]; my = vec[1]; path = null; }
    else if (path) {
      var dx = path[0] - state.feet[0], dy = path[1] - state.feet[1];
      var d = Math.hypot(dx, dy);
      if (d &lt; 2) { path = null; }
      else { mx = dx / d; my = dy / d; }
    }
    state.walking = !frozen &amp;&amp; !!(mx || my);
    if (state.walking) {
      // 想走却一直没挪动 → 可能卡在不可走的地方，自动脱困
      if (!walkable(state.feet[0], state.feet[1])) {
        var esc = nearestWalkable(state.scene, state.feet[0], state.feet[1]);
        state.feet[0] = esc[0]; state.feet[1] = esc[1];
        doorArmed = false;
        post(&#x27;log&#x27;, &#x27;已脱困&#x27;);
      }
      if (Math.abs(mx) &gt; Math.abs(my)) state.dir = mx &gt; 0 ? &#x27;right&#x27; : &#x27;left&#x27;;
      else state.dir = my &gt; 0 ? &#x27;down&#x27; : &#x27;up&#x27;;
      tryMove(mx * SPEED * dt, my * SPEED * dt);
      checkDoors(mx, my);
    }

    updateCamera(false);
    checkAction(false);
    if (fishing.phase !== &#x27;idle&#x27; &amp;&amp; fishing.phase !== &#x27;done&#x27;) fishingTick(dt * 1000);

    // 摄像机只变换一次：渲染器内部会按 o.camera 平移，外面绝对不能再平移一遍。
    // 之前两边都做，画面偏了 56 像素，点击位置跟角色对不上。
    ctx.save();
    ctx.fillStyle = state.scene === &#x27;coast&#x27; ? &#x27;#14243A&#x27; : &#x27;#0A0B14&#x27;;
    ctx.fillRect(0, 0, VW, VH);
    art.draw(ctx, state.scene, {
      t: state.reduceMotion ? 0 : o.t,
      hours: o.hours,
      wake: o.wake,
      weather: state.weather,
      hud: false,
      camera: state.camera,
      // 钓鱼时不让渲染器画角色，改用钓鱼精灵。
      // 必须传 false —— 渲染器对 null 会回落到默认角色，画出第二个人。
      actor: fishing.phase === &#x27;idle&#x27;
        ? { feet: state.feet, direction: state.dir, walking: state.walking }
        : false,
    });
    ctx.restore();

    drawFishingActor(ctx);

    tankPhase += 0.016;
    drawTank(ctx, state.tankCount);
    drawMounts(ctx);
    drawBook(ctx);
    drawRack(ctx);
    drawSpotMarker(ctx, o.t);
    drawFishing(ctx, o.t);
    drawHud(ctx);

    raf = requestAnimationFrame(step);
  }

  /**
   * 控鱼界面。竖着的一条轨道贴在右侧，拇指按住抬升、松开下落。
   * 轨道 160 像素、控制条随装备变化，和配置里的数值一致。
   */
  function drawFishing(g, t) {
    var e = fishing.enc;
    if (!e || fishing.phase === &#x27;idle&#x27;) return;

    var trackH = 160, trackW = 20;
    var tx = VW - trackW - 18;
    var ty = Math.round((VH - trackH) / 2) - 10;

    g.save();

    // 等待咬钩：浮漂已经在动了，这里只画涟漪和一行字
    if (fishing.phase === &#x27;waiting&#x27;) {
      // 浮标是精灵自己画的，位置固定在脚底右方 (+89, -3)。
      // 波纹按这个点画，才会和画面上的浮标对齐。
      var flipW = state.dir === &#x27;left&#x27;;
      var sx = state.feet[0] - state.camera[0] + (flipW ? -89 : 89);
      var sy = state.feet[1] - state.camera[1] - 3;
      for (var i = 0; i &lt; 3; i++) {
        var k = ((t * 0.5 + i / 3) % 1);
        g.globalAlpha = (1 - k) * 0.4;
        g.strokeStyle = &#x27;#9DA0FF&#x27;;
        g.lineWidth = 1;
        g.beginPath();
        g.ellipse(sx, sy, 3 + k * 14, 1.5 + k * 6, 0, 0, Math.PI * 2);
        g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = &#x27;#E8E9F5&#x27;;
      g.font = &#x27;9px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(&#x27;等待咬钩…&#x27;, VW / 2, ty - 14);
      g.restore();
      return;
    }

    // 咬钩：整屏闪一下，提示赶紧按
    if (fishing.phase === &#x27;biting&#x27;) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 18);
      g.globalAlpha = 0.18 + fishing.flash * 0.25;
      g.fillStyle = &#x27;#FFD470&#x27;;
      g.fillRect(0, 0, VW, VH);
      g.globalAlpha = 1;
      g.fillStyle = &#x27;#FFD470&#x27;;
      g.font = &#x27;16px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(&#x27;咬钩了！按住屏幕&#x27;, VW / 2, VH / 2 - 30);
      var left = Math.max(0, e.reactLeftMs) / 1000;
      g.font = &#x27;11px -apple-system,sans-serif&#x27;;
      g.fillStyle = pulse &gt; 0.5 ? &#x27;#FFFFFF&#x27; : &#x27;#FFD470&#x27;;
      g.fillText(left.toFixed(1) + &#x27; 秒&#x27;, VW / 2, VH / 2 - 12);
      g.restore();
      return;
    }

    if (fishing.phase === &#x27;retrieving&#x27;) {
      g.globalAlpha = 0.85;
      g.fillStyle = fishing.pendingResult &amp;&amp; fishing.pendingResult.result === &#x27;landed&#x27; ? &#x27;#3FD9A0&#x27; : &#x27;#FF7A45&#x27;;
      g.font = &#x27;12px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(
        fishing.pendingResult &amp;&amp; fishing.pendingResult.result === &#x27;landed&#x27; ? &#x27;收线中…&#x27; : &#x27;跑掉了，收回空钩&#x27;,
        VW / 2, ty - 14
      );
      g.restore();
      return;
    }
    if (fishing.phase !== &#x27;fighting&#x27;) { g.restore(); return; }

    var e2 = fishing.enc;
    var prog = Math.min(1, Math.max(0, e2.progress || 0));
    var m = fishing.mode;
    var cx = VW / 2;
    var left = Math.max(0, (e2.dragTotalMs - e2.dragElapsedMs) / 1000);

    // 进度条统一画在下方
    function progressBar(y) {
      var bw = 160, bx = (VW - bw) / 2;
      g.fillStyle = &#x27;rgba(10,11,20,0.82)&#x27;;
      g.fillRect(bx - 3, y - 3, bw + 6, 12);
      g.fillStyle = prog &gt; 0.66 ? &#x27;#3FD9A0&#x27; : prog &gt; 0.33 ? &#x27;#FFD470&#x27; : &#x27;#FF7A45&#x27;;
      g.fillRect(bx, y, bw * prog, 6);
      g.strokeStyle = &#x27;#3A4170&#x27;;
      g.lineWidth = 1;
      g.strokeRect(bx - 2.5, y - 2.5, bw + 5, 11);
      var grace = e2.graceUsedMs || 0;
      if (grace &gt; 0) {
        // 见底了：显示还剩多久，闪红提醒
        var g2 = Math.max(0, ((e2.graceMs || 1500) - grace) / 1000);
        g.fillStyle = Math.sin(Date.now() / 90) &gt; 0 ? &#x27;#FF5A5A&#x27; : &#x27;#FF9F2E&#x27;;
        g.font = &#x27;11px -apple-system,sans-serif&#x27;;
        g.textAlign = &#x27;center&#x27;;
        g.fillText(&#x27;快脱钩了！&#x27; + g2.toFixed(1) + &#x27; 秒&#x27;, cx, y + 20);
      } else {
        g.fillStyle = left &lt; 2 ? &#x27;#FF7A45&#x27; : &#x27;#8A8FA8&#x27;;
        g.font = &#x27;10px -apple-system,sans-serif&#x27;;
        g.textAlign = &#x27;center&#x27;;
        g.fillText(left.toFixed(1) + &#x27; 秒&#x27;, cx, y + 20);
      }
    }

    if (m === &#x27;ring&#x27;) {
      // 短促挣扎：按住让光圈扩散，到虚线圈时松手
      var rcy = VH / 2 + 10;
      var maxR = 52;
      g.strokeStyle = &#x27;#FFD470&#x27;;
      g.lineWidth = 1.5;
      g.setLineDash([4, 4]);
      g.beginPath();
      g.arc(cx, rcy, fishing.ringTarget * maxR, 0, Math.PI * 2);
      g.stroke();
      g.setLineDash([]);

      var rr = fishing.hold * maxR;
      var near = Math.abs(fishing.hold - fishing.ringTarget) &lt;= 0.07;
      g.strokeStyle = near ? &#x27;#3FD9A0&#x27; : &#x27;#9DA0FF&#x27;;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(cx, rcy, Math.max(2, rr), 0, Math.PI * 2);
      g.stroke();

      g.fillStyle = &#x27;#E8E9F5&#x27;;
      g.font = &#x27;10px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(&#x27;按住扩散，到虚线圈松手&#x27;, cx, rcy - maxR - 12);
      progressBar(rcy + maxR + 18);
      g.restore();
      return;
    }

    if (m === &#x27;tap_bar&#x27;) {
      g.fillStyle = &#x27;#E8E9F5&#x27;;
      g.font = &#x27;12px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(&#x27;连续点击&#x27;, cx, VH / 2 - 6);
      g.fillStyle = &#x27;#8A8FA8&#x27;;
      g.font = &#x27;9px -apple-system,sans-serif&#x27;;
      g.fillText(&#x27;已点 &#x27; + fishing.taps + &#x27; 下&#x27;, cx, VH / 2 + 10);
      progressBar(VH / 2 + 30);
      g.restore();
      return;
    }

    if (m === &#x27;drag_h&#x27;) {
      // 横向轨道
      var tw = 180, tx2 = (VW - tw) / 2, ty2 = VH / 2 + 6;
      g.fillStyle = &#x27;rgba(10,11,20,0.8)&#x27;;
      g.fillRect(tx2 - 3, ty2 - 12, tw + 6, 26);
      g.strokeStyle = &#x27;#3A4170&#x27;;
      g.lineWidth = 1;
      g.strokeRect(tx2 - 2.5, ty2 - 11.5, tw + 5, 25);

      var bh = barHalf(e2) * tw;
      var bxp = tx2 + fishing.barPos * tw;
      var fxp = tx2 + fishing.fishPos * tw;
      var cov = Math.abs(fishing.barPos - fishing.fishPos) &lt;= barHalf(e2);
      g.fillStyle = cov ? &#x27;rgba(63,217,160,0.45)&#x27; : &#x27;rgba(84,87,255,0.4)&#x27;;
      g.fillRect(bxp - bh, ty2 - 9, bh * 2, 20);
      g.strokeStyle = cov ? &#x27;#3FD9A0&#x27; : &#x27;#5457FF&#x27;;
      g.strokeRect(bxp - bh + 0.5, ty2 - 8.5, bh * 2 - 1, 19);
      g.fillStyle = &#x27;#FFD470&#x27;;
      g.fillRect(fxp - 3, ty2 - 5, 6, 12);

      g.fillStyle = &#x27;#8A8FA8&#x27;;
      g.font = &#x27;9px -apple-system,sans-serif&#x27;;
      g.textAlign = &#x27;center&#x27;;
      g.fillText(&#x27;左右拖动&#x27;, cx, ty2 - 18);
      progressBar(ty2 + 28);
      g.restore();
      return;
    }

    // valley / hold_bar：竖直轨道
    var trackH = 150, trackW = 22;
    var vx = VW - trackW - 20;
    var vy = Math.round((VH - trackH) / 2);
    g.fillStyle = &#x27;rgba(10,11,20,0.8)&#x27;;
    g.fillRect(vx - 3, vy - 3, trackW + 6, trackH + 6);
    g.strokeStyle = &#x27;#3A4170&#x27;;
    g.lineWidth = 1;
    g.strokeRect(vx - 2.5, vy - 2.5, trackW + 5, trackH + 5);

    var half = barHalf(e2) * trackH;
    var byp = vy + (1 - fishing.barPos) * trackH;
    var fyp = vy + (1 - fishing.fishPos) * trackH;
    var cov2 = Math.abs(fishing.barPos - fishing.fishPos) &lt;= barHalf(e2);
    g.fillStyle = cov2 ? &#x27;rgba(63,217,160,0.45)&#x27; : &#x27;rgba(84,87,255,0.4)&#x27;;
    g.fillRect(vx, byp - half, trackW, half * 2);
    g.strokeStyle = cov2 ? &#x27;#3FD9A0&#x27; : &#x27;#5457FF&#x27;;
    g.strokeRect(vx + 0.5, byp - half + 0.5, trackW - 1, half * 2 - 1);
    g.fillStyle = &#x27;#FFD470&#x27;;
    g.fillRect(vx + 4, fyp - 3, trackW - 8, 6);

    g.fillStyle = &#x27;#8A8FA8&#x27;;
    g.font = &#x27;9px -apple-system,sans-serif&#x27;;
    g.textAlign = &#x27;center&#x27;;
    g.fillText(m === &#x27;valley&#x27; ? &#x27;点击上浮&#x27; : &#x27;按住上升&#x27;, vx + trackW / 2, vy + trackH + 16);
    progressBar(vy + trackH + 30);
    g.restore();
  }

  /**
   * 钓鱼中的角色、鱼线、浮漂、鱼钩。
   * 画在场景之后、控鱼界面之前，所以会挡住渲染器的普通角色。
   */
  function drawFishingActor(g) {
    var A = fishing.anim, T = fishing.tackle;
    if (!A || fishing.phase === &#x27;idle&#x27;) return;

    var flip = state.dir === &#x27;left&#x27;;
